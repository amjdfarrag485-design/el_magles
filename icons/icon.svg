<?xml version="1.0" encoding="UTF-8"?>
<!--
  ╔══════════════════════════════════════════════════╗
  ║     أيقونة التطبيق الإسلامي الشامل - SVG       ║
  ║     تصميم: هلال ذهبي مع مسجد ونجمة             ║
  ╚══════════════════════════════════════════════════╝
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- التدرج الذهبي للخلفية -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a1a"/>
      <stop offset="100%" stop-color="#1a1a0e"/>
    </radialGradient>

    <!-- التدرج الذهبي الرئيسي -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8960c"/>
    </linearGradient>

    <!-- التدرج الذهبي للهلال -->
    <linearGradient id="crescentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e080"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a07a08"/>
    </linearGradient>

    <!-- تدرج الحدود الذهبية -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f0d060"/>
      <stop offset="75%" stop-color="#b8960c"/>
      <stop offset="100%" stop-color="#f0d060"/>
    </linearGradient>

    <!-- تدرج التوهج -->
    <radialGradient id="glowGradient" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>

    <!-- ظل ناعم -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
      <feColorMatrix values="0 0 0 0 0.83  0 0 0 0 0.69  0 0 0 0 0.22  0 0 0 0.4 0"/>
      <feBlend in2="SourceGraphic"/>
    </filter>

    <!-- توهج ذهبي -->
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- نمط الزخرفة الإسلامية -->
    <pattern id="islamicPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="20" cy="20" r="1" fill="#d4af37" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- الخلفية الدائرية -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGradient)"/>

  <!-- نمط الزخرفة في الخلفية -->
  <circle cx="256" cy="256" r="245" fill="url(#islamicPattern)"/>

  <!-- التوهج الداخلي -->
  <circle cx="256" cy="230" r="200" fill="url(#glowGradient)"/>

  <!-- الحدود الذهبية الخارجية -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#borderGradient)" stroke-width="4"/>

  <!-- الحدود الذهبية الداخلية -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.5"/>

  <!-- زخرفة دائرية بنقاط -->
  <g opacity="0.3">
    <!-- 12 نقطة حول الدائرة -->
    <circle cx="256" cy="28" r="3" fill="#d4af37"/>
    <circle cx="370" cy="70" r="3" fill="#d4af37"/>
    <circle cx="444" cy="142" r="3" fill="#d4af37"/>
    <circle cx="484" cy="256" r="3" fill="#d4af37"/>
    <circle cx="444" cy="370" r="3" fill="#d4af37"/>
    <circle cx="370" cy="444" r="3" fill="#d4af37"/>
    <circle cx="256" cy="484" r="3" fill="#d4af37"/>
    <circle cx="142" cy="444" r="3" fill="#d4af37"/>
    <circle cx="68" cy="370" r="3" fill="#d4af37"/>
    <circle cx="28" cy="256" r="3" fill="#d4af37"/>
    <circle cx="68" cy="142" r="3" fill="#d4af37"/>
    <circle cx="142" cy="70" r="3" fill="#d4af37"/>
  </g>

  <!-- مجموعة الرمز الإسلامي (هلال ونجمة ومسجد) -->
  <g filter="url(#softShadow)">

    <!-- القبة / المسجد -->
    <g transform="translate(256, 320)">
      <!-- قاعدة المسجد -->
      <rect x="-90" y="0" width="180" height="60" rx="4" fill="url(#goldGradient)" opacity="0.9"/>

      <!-- القبة الرئيسية -->
      <path d="M-70,0 Q-70,-60 0,-80 Q70,-60 70,0 Z" fill="url(#goldGradient)" opacity="0.85"/>

      <!-- القبة الصغيرة اليمنى -->
      <path d="M50,0 Q50,-25 70,-35 Q90,-25 90,0 Z" fill="url(#goldGradient)" opacity="0.7"/>

      <!-- القبة الصغيرة اليسرى -->
      <path d="M-90,0 Q-90,-25 -70,-35 Q-50,-25 -50,0 Z" fill="url(#goldGradient)" opacity="0.7"/>

      <!-- المئذنة اليمنى -->
      <rect x="85" y="-50" width="12" height="110" rx="3" fill="url(#goldGradient)" opacity="0.8"/>
      <circle cx="91" cy="-52" r="5" fill="#f0d060" opacity="0.9"/>

      <!-- المئذنة اليسرى -->
      <rect x="-97" y="-50" width="12" height="110" rx="3" fill="url(#goldGradient)" opacity="0.8"/>
      <circle cx="-91" cy="-52" r="5" fill="#f0d060" opacity="0.9"/>

      <!-- باب المسجد -->
      <path d="M-15,60 L-15,25 Q0,10 15,25 L15,60 Z" fill="#1a1a0e" opacity="0.6"/>

      <!-- نوافذ صغيرة -->
      <circle cx="-35" cy="20" r="6" fill="#1a1a0e" opacity="0.3"/>
      <circle cx="35" cy="20" r="6" fill="#1a1a0e" opacity="0.3"/>
    </g>

    <!-- الهلال -->
    <g transform="translate(256, 165)" filter="url(#goldGlow)">
      <!-- الهلال: دائرة كبيرة مقطوعة بدائرة أصغر -->
      <circle cx="0" cy="0" r="55" fill="url(#crescentGradient)"/>
      <circle cx="18" cy="-10" r="45" fill="url(#bgGradient)"/>
    </g>

    <!-- النجمة بجانب الهلال -->
    <g transform="translate(298, 140)" filter="url(#goldGlow)">
      <!-- نجمة خماسية -->
      <polygon
        points="0,-18 4,-6 17,-6 7,3 11,15 0,8 -11,15 -7,3 -17,-6 -4,-6"
        fill="url(#crescentGradient)"
      />
    </g>

    <!-- نجمات صغيرة مزخرفة -->
    <g opacity="0.6">
      <polygon transform="translate(180, 120) scale(0.4)"
        points="0,-18 4,-6 17,-6 7,3 11,15 0,8 -11,15 -7,3 -17,-6 -4,-6"
        fill="#d4af37"/>
      <polygon transform="translate(340, 180) scale(0.3)"
        points="0,-18 4,-6 17,-6 7,3 11,15 0,8 -11,15 -7,3 -17,-6 -4,-6"
        fill="#d4af37"/>
      <polygon transform="translate(170, 200) scale(0.25)"
        points="0,-18 4,-6 17,-6 7,3 11,15 0,8 -11,15 -7,3 -17,-6 -4,-6"
        fill="#f0d060"/>
    </g>
  </g>

  <!-- النص: بسم الله -->
  <text x="256" y="440" text-anchor="middle" font-family="'Amiri', 'Traditional Arabic', serif"
    font-size="26" fill="url(#goldGradient)" opacity="0.85" letter-spacing="2">
    بسم الله الرحمن الرحيم
  </text>
</svg>
